name: Build Desktop Executables

on:
  push:
    paths:
      - '**.py'
      - '**.spec'
      - '**.ini'
      - 'requirements.txt'
      - 'setup.py'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pygame-ce
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        shell: bash

      - name: Build with PyInstaller
        run: pyinstaller --clean --noconfirm starpusher.spec
        shell: bash

      - name: Archive Windows executable
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/starpusher.exe -DestinationPath starpusher-windows.zip

      - name: Archive Linux executable
        if: runner.os == 'Linux'
        run: tar -czvf starpusher-linux.tar.gz -C dist starpusher

      - name: Archive macOS application
        if: runner.os == 'macOS'
        run: zip -j starpusher-macos.zip dist/starpusher

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: starpusher-${{ runner.os }}
          path: |
            starpusher-*.zip
            starpusher-*.tar.gz

  release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Create Release and upload files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Star Pusher v1.0.${{ github.run_number }}
          files: |
            artifacts/starpusher-Windows/starpusher-windows.zip
            artifacts/starpusher-Linux/starpusher-linux.tar.gz
            artifacts/starpusher-macOS/starpusher-macos.zip

      - name: Setup Butler
        uses: remarkablegames/setup-butler@v1

      - name: Publish Windows to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_win
          cp artifacts/starpusher-Windows/starpusher-windows.zip push_win/
          butler push push_win shivamkr12/star-pusher:windows --userversion v1.0.${{ github.run_number }}

      - name: Publish Linux to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_linux
          cp artifacts/starpusher-Linux/starpusher-linux.tar.gz push_linux/
          butler push push_linux shivamkr12/star-pusher:linux --userversion v1.0.${{ github.run_number }}

      - name: Publish macOS to itch.io via Butler
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          mkdir -p push_mac
          cp artifacts/starpusher-macOS/starpusher-macos.zip push_mac/
          butler push push_mac shivamkr12/star-pusher:mac --userversion v1.0.${{ github.run_number }}
